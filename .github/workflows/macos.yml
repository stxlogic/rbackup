name: macOS build and tests

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      apple_silicon:
        description: Run on Apple Silicon
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  macos:
    runs-on: ${{ inputs.apple_silicon && 'macos-15' || 'macos-15-intel' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: brew install restic
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri -- build --debug --bundles app,dmg --no-sign -- --locked
