name: Draft desktop release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example, rbackup-0.1.2)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            bundle: deb
            asset: 'src-tauri/target/release/bundle/deb/*.deb'
          - runner: windows-2025
            bundle: nsis
            asset: 'src-tauri/target/release/bundle/nsis/*.exe'
          - runner: macos-15-intel
            bundle: dmg
            flags: '--target universal-apple-darwin --no-sign'
            asset: 'src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Check release version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: >-
          node -e "const version = require('./src-tauri/tauri.conf.json').version;
          const tag = process.env.RELEASE_TAG;
          if (tag !== 'rbackup-' + version && tag !== 'v' + version)
          throw new Error('Release tag ' + tag + ' does not match app version ' + version)"
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install macOS Rust targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: npm ci
      - run: npm test
      - run: npm run tauri -- build --bundles ${{ matrix.bundle }} ${{ matrix.flags }} -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.bundle }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  draft:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: installers
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" installers/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes
